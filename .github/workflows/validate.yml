name: Validate Wondful

on:
  pull_request:
  push:
    branches:
      - main
      - "wondful-*"

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy pyflakes
      - name: Compile Python sources
        run: python -m compileall -q wondful_ai_renderer tests
      - name: Check for undefined names
        run: python tools/check_undefined_names.py
      - name: Check UI translation coverage
        run: python tools/check_i18n.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build installable ZIP
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: wondful-addon-zip
          path: dist/*.zip
